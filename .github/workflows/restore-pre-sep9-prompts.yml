name: Restore pre-Sep9 agent prompts

on:
  push:
    branches:
      - restore-pre-sep9-prompts-safe

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-pre-sep9-prompts-safe
          fetch-depth: 0

      - name: Restore and verify canonical prompts only
        shell: bash
        run: |
          python - <<'PY'
          import copy, json, subprocess
          from pathlib import Path

          BASE = 'f581b4c4f73a71d195f2555468701b8d3acb03d7'
          path = Path('opencode/opencode.template.json')
          before = json.loads(path.read_text(encoding='utf-8-sig'))
          old = json.loads(subprocess.check_output(['git','show',f'{BASE}:opencode/opencode.template.json']).decode('utf-8-sig'))
          after = copy.deepcopy(before)

          expected = ['software-engineer','team-lead','systems-engineer','qa-engineer','devops-engineer','solution-architect','platform-engineer','security-engineer']
          restored = []
          for agent_id, old_agent in old.get('agent', {}).items():
              if 'prompt' not in old_agent:
                  continue
              if agent_id not in after.get('agent', {}):
                  raise SystemExit(f'Missing current agent: {agent_id}')
              after['agent'][agent_id]['prompt'] = old_agent['prompt']
              restored.append(agent_id)

          if restored != expected:
              raise SystemExit(f'Unexpected restored prompt set: {restored!r}')

          def strip_prompts(obj):
              obj = copy.deepcopy(obj)
              for agent in obj.get('agent', {}).values():
                  agent.pop('prompt', None)
              return obj

          if strip_prompts(before) != strip_prompts(after):
              raise SystemExit('Non-prompt configuration changed unexpectedly')
          for agent_id in expected:
              if after['agent'][agent_id]['prompt'] != old['agent'][agent_id]['prompt']:
                  raise SystemExit(f'Prompt mismatch after restore: {agent_id}')

          path.write_text(json.dumps(after, ensure_ascii=False, indent=2) + '\n', encoding='utf-8-sig')
          # Parse written file again and verify exact prompt equality after serialization.
          written = json.loads(path.read_text(encoding='utf-8-sig'))
          for agent_id in expected:
              if written['agent'][agent_id]['prompt'] != old['agent'][agent_id]['prompt']:
                  raise SystemExit(f'Written prompt mismatch: {agent_id}')
          print('All 8 prompts restored exactly:', ', '.join(expected))
          PY

      - name: Commit restored prompts
        shell: bash
        run: |
          rm -f .github/workflows/restore-pre-sep9-prompts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode/opencode.template.json .github/workflows/restore-pre-sep9-prompts.yml
          git commit -m "fix: restore agent prompts to pre-Sep9 versions"
          git push origin HEAD:restore-pre-sep9-prompts-safe
