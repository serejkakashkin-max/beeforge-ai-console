name: BeeLlama 0.4.6 bootstrap
on:
  push:
    branches: [ feat/beellama-v0.4.6-runtime ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[beellama-046-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beellama-v0.4.6-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply BeeLlama 0.4.6 patch
        shell: pwsh
        run: python tools/apply-beellama-046.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $files = @('scripts/BeeLlamaManager.Core.psm1','ui/BeeLlama-Manager.ps1') + @(Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object { $_.FullName }) + @(Get-ChildItem tests -Filter '*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Run smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/MoEProfile.Smoke.ps1
          pwsh -NoProfile -File tests/RuntimeProfile.Smoke.ps1
          pwsh -NoProfile -File tests/BeeLlamaRuntime.Smoke.ps1
      - name: Commit patched files
        shell: pwsh
        run: |
          git checkout HEAD -- .github/workflows/beellama-046-bootstrap.yml tools/apply-beellama-046.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: default to BeeLlama v0.4.6 CUDA 13.3 [beellama-046-applied]"
          git push origin HEAD:feat/beellama-v0.4.6-runtime
