name: Apply no-WSL SSH policy fix v2

on:
  push:
    branches: [fix/disable-wsl-ssh]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/disable-wsl-ssh
      - name: Apply patch
        run: python .github/patch-no-wsl.py
      - name: Validate JSON
        shell: pwsh
        run: |
          ./tests/SystemsEngineer.NoWsl.Smoke.ps1
          Get-Content -Raw ./opencode/opencode.template.json | ConvertFrom-Json | Out-Null
      - name: Commit result
        shell: bash
        run: |
          rm -f .github/patch-no-wsl.py .github/workflows/apply-disable-wsl-ssh-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep SSH agents on native Windows without WSL"
          git push origin HEAD:fix/disable-wsl-ssh
