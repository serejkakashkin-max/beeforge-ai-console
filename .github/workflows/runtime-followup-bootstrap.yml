name: Runtime follow-up bootstrap
on:
  push:
    branches: [ fix/runtime-profile-hardening-20260909 ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-followup-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-profile-hardening-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply follow-up patch
        shell: pwsh
        run: python tools/apply-runtime-followup.py
      - name: Parse UI
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ui/BeeLlama-Manager.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;exit 1}
      - name: Run profile smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/MoEProfile.Smoke.ps1
          pwsh -NoProfile -File tests/RuntimeProfile.Smoke.ps1
      - name: Commit follow-up without workflow mutation
        shell: pwsh
        run: |
          git checkout HEAD -- .github/workflows/runtime-followup-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reset model-specific offload and flag RAM pressure [runtime-followup-applied]"
          git push origin HEAD:fix/runtime-profile-hardening-20260909
