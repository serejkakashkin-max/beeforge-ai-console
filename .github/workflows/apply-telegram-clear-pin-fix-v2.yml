name: Apply Telegram clear and pin fix v2

on:
  push:
    branches:
      - fix/telegram-clear-pin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-clear-pin

      - name: Patch Telegram bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_path = Path('tools/telegram-bridge/v1.0.0/bridge.mjs')
          text = bridge_path.read_text(encoding='utf-8-sig')

          old_clear = '''async function clearRecentTelegramChat(anchorMessageId) {
            // Telegram has no bot API method that clears a chat wholesale. In a private
            // chat, however, it permits deleting incoming and outgoing messages younger
            // than 48 hours, in deleteMessages batches of at most 100 IDs.
            const latest = Math.max(1, Number(anchorMessageId || 0));
            // Scan a broad ID range, not just the latest 500 IDs. The previous fixed
            // window repeated the same range on every click and could never reach older
            // but still deletable messages. Telegram safely skips missing/expired IDs.
            const ids = Array.from({ length: Math.min(5000, latest) }, (_unused, index) => latest - index);
            let attempted = 0;
            for (let index = 0; index < ids.length; index += 100) {
              const messageIds = ids.slice(index, index + 100);
              try {
                await telegram("deleteMessages", { chat_id: config.allowedChatId, message_ids: messageIds });
                attempted += messageIds.length;
              } catch (error) {
                audit("chat_clear_batch_failed", { start: messageIds.at(0), end: messageIds.at(-1), error: error.message });
              }
            }
            pinnedMessageId = null;
            pendingQuestions.clear();
            callbacks.clear();
            openRequests.clear();
            saveBridgeState();
            audit("chat_cleared", { attempted, anchorMessageId: latest });
            await send("🧹 Чат очищен. Нажмите /start, чтобы снова открыть меню.");
          }'''

          new_clear = '''async function deleteTelegramMessagesResilient(messageIds) {
            const ids = [...new Set((messageIds || []).map(Number).filter((id) => Number.isInteger(id) && id > 0))];
            if (!ids.length) return { requested: 0, failed: 0 };
            try {
              await telegram("deleteMessages", { chat_id: config.allowedChatId, message_ids: ids });
              return { requested: ids.length, failed: 0 };
            } catch (error) {
              const message = String(error.message || "");
              // A single too-old message can reject an otherwise useful batch. Only
              // bisect Telegram Bad Request failures; transport/server errors must not
              // explode into dozens of API calls.
              if (!/Bad Request|can't be deleted|cannot be deleted/i.test(message)) throw error;
              if (ids.length === 1) {
                audit("chat_clear_message_skipped", { messageId: ids[0], error: message });
                return { requested: 1, failed: 1 };
              }
              const middle = Math.ceil(ids.length / 2);
              const left = await deleteTelegramMessagesResilient(ids.slice(0, middle));
              const right = await deleteTelegramMessagesResilient(ids.slice(middle));
              return { requested: left.requested + right.requested, failed: left.failed + right.failed };
            }
          }

          async function normalizePinnedStatusAfterClear(messageId) {
            if (!messageId) return;
            try {
              // Older buggy builds could leave several BeeForge cards pinned. Collapse
              // the chat back to exactly the status card tracked in bridge-state.json.
              await telegram("unpinAllChatMessages", { chat_id: config.allowedChatId });
              await telegram("pinChatMessage", { chat_id: config.allowedChatId, message_id: messageId, disable_notification: true });
            } catch (error) {
              audit("pinned_status_normalize_failed", { messageId, error: error.message });
            }
          }

          async function clearRecentTelegramChat(anchorMessageId) {
            // Telegram cannot clear a private chat wholesale. Delete the recent range,
            // but preserve the one BeeForge status card so the next refresh edits it
            // instead of manufacturing another pinned message.
            const latest = Math.max(1, Number(anchorMessageId || 0));
            const protectedPinnedId = Number(pinnedMessageId || 0) || 0;
            const ids = Array.from({ length: Math.min(5000, latest) }, (_unused, index) => latest - index)
              .filter((messageId) => messageId !== protectedPinnedId);
            let requested = 0;
            let failed = 0;
            for (let index = 0; index < ids.length; index += 100) {
              try {
                const result = await deleteTelegramMessagesResilient(ids.slice(index, index + 100));
                requested += result.requested;
                failed += result.failed;
                // IDs decrease with age in a private chat. Once an existing message in
                // this boundary batch is too old to delete, lower IDs are older too.
                if (result.failed > 0) break;
              } catch (error) {
                audit("chat_clear_batch_failed", { start: ids[index], end: ids[Math.min(ids.length - 1, index + 99)], error: error.message });
                break;
              }
            }
            pendingQuestions.clear();
            callbacks.clear();
            openRequests.clear();
            saveBridgeState();
            audit("chat_cleared", { requested, failed, anchorMessageId: latest, preservedPinnedMessageId: protectedPinnedId || "" });
            if (config.pinnedStatus !== false && protectedPinnedId) {
              await normalizePinnedStatusAfterClear(protectedPinnedId);
              await updatePinnedStatus();
              schedulePinnedStatus(250);
            }
            await send("🧹 Чат очищен. Закреплённый статус BeeForge сохранён и обновляется на месте.");
          }'''

          if old_clear not in text:
              raise SystemExit('clearRecentTelegramChat marker not found')
          text = text.replace(old_clear, new_clear, 1)

          old_guard = '''async function updatePinnedStatus(forceCreate = false) {
            if (config.pinnedStatus === false || pinnedUpdateInFlight) return;
            pinnedUpdateInFlight = true;'''
          new_guard = '''async function updatePinnedStatus(forceCreate = false) {
            if (config.pinnedStatus === false) return;
            if (pinnedUpdateInFlight) {
              schedulePinnedStatus(250);
              return;
            }
            pinnedUpdateInFlight = true;'''
          if old_guard not in text:
              raise SystemExit('updatePinnedStatus guard marker not found')
          text = text.replace(old_guard, new_guard, 1)

          old_failure = '''      if (/message is not modified/i.test(String(error.message))) return;
                audit("pinned_status_edit_failed", { messageId: pinnedMessageId, error: error.message });
                pinnedMessageId = null;'''
          new_failure = '''      const message = String(error.message || "");
                if (/message is not modified/i.test(message)) return;
                audit("pinned_status_edit_failed", { messageId: pinnedMessageId, error: message });
                // Keep the known pin on transient/unknown edit failures. Creating a new
                // status message is justified only when Telegram says the stored message
                // is actually gone or cannot be edited.
                if (!/(message to edit not found|message_id_invalid|message can't be edited|message cannot be edited)/i.test(message)) {
                  schedulePinnedStatus(2000);
                  return;
                }
                pinnedMessageId = null;
                saveBridgeState();'''
          if old_failure not in text:
              raise SystemExit('pinned edit failure lines not found')
          text = text.replace(old_failure, new_failure, 1)

          bridge_path.write_text(text, encoding='utf-8-sig')

          test_path = Path('tests/TelegramBridge.ClearPin.Smoke.ps1')
          test_path.write_text(r'''Set-StrictMode -Version 2.0
          $ErrorActionPreference = 'Stop'
          $root = Split-Path $PSScriptRoot -Parent
          $bridgePath = Join-Path $root 'tools\telegram-bridge\v1.0.0\bridge.mjs'
          $bridge = [IO.File]::ReadAllText($bridgePath, [Text.UTF8Encoding]::new($true))

          $clearStart = $bridge.IndexOf('async function clearRecentTelegramChat(anchorMessageId)')
          $clearEnd = $bridge.IndexOf('async function telegramUpload(', $clearStart)
          if ($clearStart -lt 0 -or $clearEnd -le $clearStart) { throw 'Unable to locate clearRecentTelegramChat source block' }
          $clearBlock = $bridge.Substring($clearStart, $clearEnd - $clearStart)

          foreach ($needle in @(
              'deleteTelegramMessagesResilient',
              'protectedPinnedId',
              '.filter((messageId) => messageId !== protectedPinnedId)',
              'if (result.failed > 0) break;',
              'normalizePinnedStatusAfterClear(protectedPinnedId)',
              'await updatePinnedStatus()'
          )) {
              if (-not $bridge.Contains($needle)) { throw "Telegram bridge regression: missing $needle" }
          }
          if ($clearBlock.Contains('pinnedMessageId = null')) { throw 'Chat clear must not discard the tracked pinned status message' }
          if (-not $bridge.Contains('if (pinnedUpdateInFlight) {') -or -not $bridge.Contains('schedulePinnedStatus(2000)')) { throw 'Pinned status updates must retry instead of creating duplicates on transient failures' }
          if (-not $bridge.Contains('unpinAllChatMessages')) { throw 'Chat clear must normalize legacy duplicate pins' }

          $node = Get-Command node -ErrorAction SilentlyContinue
          if ($node) {
              & $node.Source --check $bridgePath
              if ($LASTEXITCODE -ne 0) { throw "node --check failed with exit code $LASTEXITCODE" }
          }
          Write-Host 'Telegram clear/pin smoke test passed.'
          ''', encoding='utf-8-sig')
          PY

      - name: Validate patch
        shell: bash
        run: |
          node --check tools/telegram-bridge/v1.0.0/bridge.mjs
          grep -q 'deleteTelegramMessagesResilient' tools/telegram-bridge/v1.0.0/bridge.mjs
          grep -q 'normalizePinnedStatusAfterClear' tools/telegram-bridge/v1.0.0/bridge.mjs
          grep -q 'Telegram clear/pin smoke test passed' tests/TelegramBridge.ClearPin.Smoke.ps1

      - name: Commit fix to feature branch
        shell: bash
        run: |
          rm -f .github/workflows/apply-telegram-clear-pin-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/telegram-bridge/v1.0.0/bridge.mjs tests/TelegramBridge.ClearPin.Smoke.ps1 .github/workflows/apply-telegram-clear-pin-fix-v2.yml
          git commit -m "fix: preserve one Telegram status pin when clearing chat"
          git push origin HEAD:fix/telegram-clear-pin
