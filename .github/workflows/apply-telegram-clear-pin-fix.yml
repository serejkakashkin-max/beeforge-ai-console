name: Apply Telegram clear and pin fix

on:
  push:
    branches:
      - fix/telegram-clear-pin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-clear-pin

      - name: Patch Telegram bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_path = Path('tools/telegram-bridge/v1.0.0/bridge.mjs')
          text = bridge_path.read_text(encoding='utf-8-sig')

          old_clear = r'''async function clearRecentTelegramChat(anchorMessageId) {
            // Telegram has no bot API method that clears a chat wholesale. In a private
            // chat, however, it permits deleting incoming and outgoing messages younger
            // than 48 hours, in deleteMessages batches of at most 100 IDs.
            const latest = Math.max(1, Number(anchorMessageId || 0));
            // Scan a broad ID range, not just the latest 500 IDs. The previous fixed
            // window repeated the same range on every click and could never reach older
            // but still deletable messages. Telegram safely skips missing/expired IDs.
            const ids = Array.from({ length: Math.min(5000, latest) }, (_unused, index) => latest - index);
            let attempted = 0;
            for (let index = 0; index < ids.length; index += 100) {
              const messageIds = ids.slice(index, index + 100);
              try {
                await telegram("deleteMessages", { chat_id: config.allowedChatId, message_ids: messageIds });
                attempted += messageIds.length;
              } catch (error) {
                audit("chat_clear_batch_failed", { start: messageIds.at(0), end: messageIds.at(-1), error: error.message });
              }
            }
            pinnedMessageId = null;
            pendingQuestions.clear();
            callbacks.clear();
            openRequests.clear();
            saveBridgeState();
            audit("chat_cleared", { attempted, anchorMessageId: latest });
            await send("🧹 Чат очищен. Нажмите /start, чтобы снова открыть меню.");
          }'''

          new_clear = r'''async function deleteTelegramMessagesResilient(messageIds) {
            const ids = [...new Set((messageIds || []).map(Number).filter((id) => Number.isInteger(id) && id > 0))];
            if (!ids.length) return { requested: 0, failed: 0 };
            try {
              await telegram("deleteMessages", { chat_id: config.allowedChatId, message_ids: ids });
              return { requested: ids.length, failed: 0 };
            } catch (error) {
              // One undeletable-but-still-existing message (for example an item older
              // than Telegram's 48-hour limit) can make a whole batch fail. Split the
              // batch until the bad ID is isolated so neighboring recent messages are
              // still removed instead of abandoning all 100 IDs.
              if (ids.length === 1) {
                audit("chat_clear_message_skipped", { messageId: ids[0], error: error.message });
                return { requested: 1, failed: 1 };
              }
              const middle = Math.ceil(ids.length / 2);
              const left = await deleteTelegramMessagesResilient(ids.slice(0, middle));
              const right = await deleteTelegramMessagesResilient(ids.slice(middle));
              return { requested: left.requested + right.requested, failed: left.failed + right.failed };
            }
          }

          async function clearRecentTelegramChat(anchorMessageId) {
            // Telegram has no bot API method that clears a chat wholesale. In a private
            // chat it permits deleting incoming and outgoing messages younger than 48h.
            // Keep the one BeeForge status card alive: deleting it and then clearing
            // pinnedMessageId was the reason every clear attempt created another pin.
            const latest = Math.max(1, Number(anchorMessageId || 0));
            const protectedPinnedId = Number(pinnedMessageId || 0) || 0;
            const ids = Array.from({ length: Math.min(5000, latest) }, (_unused, index) => latest - index)
              .filter((messageId) => messageId !== protectedPinnedId);
            let requested = 0;
            let failed = 0;
            for (let index = 0; index < ids.length; index += 100) {
              const result = await deleteTelegramMessagesResilient(ids.slice(index, index + 100));
              requested += result.requested;
              failed += result.failed;
            }
            pendingQuestions.clear();
            callbacks.clear();
            openRequests.clear();
            saveBridgeState();
            audit("chat_cleared", { requested, failed, anchorMessageId: latest, preservedPinnedMessageId: protectedPinnedId || "" });
            // Refresh the existing pinned card so its newly generated callback tokens
            // replace the callbacks cleared above. If another status edit is already in
            // flight, updatePinnedStatus schedules a retry instead of creating a new pin.
            if (config.pinnedStatus !== false) {
              await updatePinnedStatus();
              schedulePinnedStatus(250);
            }
            await send("🧹 Чат очищен. Закреплённый статус BeeForge сохранён и будет обновляться на месте.");
          }'''

          if old_clear not in text:
              raise SystemExit('clearRecentTelegramChat marker not found; refusing blind patch')
          text = text.replace(old_clear, new_clear, 1)

          old_pin_guard = '''async function updatePinnedStatus(forceCreate = false) {
            if (config.pinnedStatus === false || pinnedUpdateInFlight) return;
            pinnedUpdateInFlight = true;'''
          new_pin_guard = '''async function updatePinnedStatus(forceCreate = false) {
            if (config.pinnedStatus === false) return;
            if (pinnedUpdateInFlight) {
              schedulePinnedStatus(250);
              return;
            }
            pinnedUpdateInFlight = true;'''
          if old_pin_guard not in text:
              raise SystemExit('updatePinnedStatus guard marker not found')
          text = text.replace(old_pin_guard, new_pin_guard, 1)

          old_pin_failure = '''      } catch (error) {
                if (/message is not modified/i.test(String(error.message))) return;
                audit("pinned_status_edit_failed", { messageId: pinnedMessageId, error: error.message });
                pinnedMessageId = null;
              }
            }
            const sent = await send(`📌 ${text}`, mainMenuKeyboard());'''
          new_pin_failure = '''      } catch (error) {
                const message = String(error.message || "");
                if (/message is not modified/i.test(message)) return;
                audit("pinned_status_edit_failed", { messageId: pinnedMessageId, error: message });
                // Do not abandon a valid pin on an unknown/transient edit failure. Only
                // create a replacement when Telegram explicitly says the stored message
                // is gone or cannot be edited. This prevents duplicate status pins.
                if (!/(message to edit not found|message_id_invalid|message can't be edited|message cannot be edited)/i.test(message)) {
                  schedulePinnedStatus(2000);
                  return;
                }
                pinnedMessageId = null;
                saveBridgeState();
              }
            }
            const sent = await send(`📌 ${text}`, mainMenuKeyboard());'''
          if old_pin_failure not in text:
              raise SystemExit('pinned edit failure marker not found')
          text = text.replace(old_pin_failure, new_pin_failure, 1)
          bridge_path.write_text(text, encoding='utf-8-sig')

          test_path = Path('tools/telegram-bridge/v1.0.0/bridge-self-test.mjs')
          test = test_path.read_text(encoding='utf-8-sig')

          marker = 'const deletedMessageBatches = [];\nlet pendingUpdates = [];'
          replacement = 'const deletedMessageBatches = [];\nconst pinnedMessageCalls = [];\nconst editedMessageCalls = [];\nlet failDeleteMessageId = 350;\nlet pendingUpdates = [];'
          if marker not in test:
              raise SystemExit('self-test state marker not found')
          test = test.replace(marker, replacement, 1)

          old_mock = '''  if (method === "deleteMessages") {
              deletedMessageBatches.push(body.message_ids || []);
              return Response.json({ ok: true, result: true });
            }'''
          new_mock = '''  if (method === "deleteMessages") {
              const ids = body.message_ids || [];
              deletedMessageBatches.push(ids);
              if (failDeleteMessageId && ids.includes(failDeleteMessageId)) {
                return Response.json({ ok: false, error_code: 400, description: "Bad Request: message can't be deleted" }, { status: 400 });
              }
              return Response.json({ ok: true, result: true });
            }'''
          if old_mock not in test:
              raise SystemExit('deleteMessages self-test mock marker not found')
          test = test.replace(old_mock, new_mock, 1)

          old_edit_pin_mock = '  if (method === "editMessageText" || method === "pinChatMessage") return Response.json({ ok: true, result: true });'
          new_edit_pin_mock = '''  if (method === "editMessageText") { editedMessageCalls.push(body); return Response.json({ ok: true, result: true }); }
            if (method === "pinChatMessage") { pinnedMessageCalls.push(body); return Response.json({ ok: true, result: true }); }'''
          if old_edit_pin_mock not in test:
              raise SystemExit('edit/pin self-test mock marker not found')
          test = test.replace(old_edit_pin_mock, new_edit_pin_mock, 1)

          old_clear_test = '''    pendingUpdates.push({ update_id: updateId++, message: { message_id: 700, from: { id: Number(realConfig.allowedUserId) }, chat: { id: Number(realConfig.allowedChatId), type: "private" }, text: "/clear" } });
              let clearChatConfirm = "";
              for (let clearAttempt = 0; clearAttempt < 80 && !clearChatConfirm; clearAttempt++) {
                await new Promise((resolve) => setTimeout(resolve, 25));
                const confirmation = sentMessages.find((item) => item.text?.includes("После очистки останется"));
                clearChatConfirm = (confirmation?.reply_markup?.inline_keyboard || []).flat().find((button) => button.text?.includes("Очистить чат"))?.callback_data || "";
              }
              if (!clearChatConfirm) throw new Error("Chat clear confirmation was not rendered");
              pendingUpdates.push({ update_id: updateId++, callback_query: { id: "callback-clear-chat-confirm", from: { id: Number(realConfig.allowedUserId) }, message: { message_id: 701, chat: { id: Number(realConfig.allowedChatId), type: "private" } }, data: clearChatConfirm } });
              for (let clearAttempt = 0; clearAttempt < 80 && !sentMessages.some((item) => item.text?.includes("Чат очищен")); clearAttempt++) await new Promise((resolve) => setTimeout(resolve, 25));
              const deletedIdCount = deletedMessageBatches.reduce((total, batch) => total + batch.length, 0);
              if (!sentMessages.some((item) => item.text?.includes("Чат очищен")) || deletedIdCount !== 701 || !deletedMessageBatches.every((batch) => batch.length <= 100)) throw new Error(`Chat clear did not scan the complete available ID range in confirmed batches: ${deletedIdCount}`);'''

          new_clear_test = '''    let pinnedBeforeClear = 0;
              for (let pinWait = 0; pinWait < 80 && !pinnedBeforeClear; pinWait++) {
                await new Promise((resolve) => setTimeout(resolve, 25));
                pinnedBeforeClear = Number(JSON.parse(fs.readFileSync(path.join(root, "bridge-state.json"), "utf8")).pinnedMessageId || 0);
              }
              if (!pinnedBeforeClear) throw new Error("Pinned status was not created before chat-clear self-test");
              const pinCallsBeforeClear = pinnedMessageCalls.length;
              const editCallsBeforeClear = editedMessageCalls.length;
              pendingUpdates.push({ update_id: updateId++, message: { message_id: 700, from: { id: Number(realConfig.allowedUserId) }, chat: { id: Number(realConfig.allowedChatId), type: "private" }, text: "/clear" } });
              let clearChatConfirm = "";
              for (let clearAttempt = 0; clearAttempt < 80 && !clearChatConfirm; clearAttempt++) {
                await new Promise((resolve) => setTimeout(resolve, 25));
                const confirmation = sentMessages.find((item) => item.text?.includes("После очистки останется"));
                clearChatConfirm = (confirmation?.reply_markup?.inline_keyboard || []).flat().find((button) => button.text?.includes("Очистить чат"))?.callback_data || "";
              }
              if (!clearChatConfirm) throw new Error("Chat clear confirmation was not rendered");
              pendingUpdates.push({ update_id: updateId++, callback_query: { id: "callback-clear-chat-confirm", from: { id: Number(realConfig.allowedUserId) }, message: { message_id: 701, chat: { id: Number(realConfig.allowedChatId), type: "private" } }, data: clearChatConfirm } });
              for (let clearAttempt = 0; clearAttempt < 160 && !sentMessages.some((item) => item.text?.includes("Чат очищен")); clearAttempt++) await new Promise((resolve) => setTimeout(resolve, 25));
              const afterClearState = JSON.parse(fs.readFileSync(path.join(root, "bridge-state.json"), "utf8"));
              const attemptedDeleteIds = new Set(deletedMessageBatches.flat());
              const expectedDeleteIds = 701 - (pinnedBeforeClear >= 1 && pinnedBeforeClear <= 701 ? 1 : 0);
              if (!sentMessages.some((item) => item.text?.includes("Чат очищен")) || attemptedDeleteIds.size !== expectedDeleteIds || attemptedDeleteIds.has(pinnedBeforeClear) || !attemptedDeleteIds.has(failDeleteMessageId) || !deletedMessageBatches.every((batch) => batch.length <= 100)) throw new Error(`Chat clear did not cover the available range while preserving the pin: unique=${attemptedDeleteIds.size}, expected=${expectedDeleteIds}`);
              if (!deletedMessageBatches.some((batch) => batch.includes(failDeleteMessageId) && batch.length < 100)) throw new Error("Chat clear did not split a failed deleteMessages batch");
              if (Number(afterClearState.pinnedMessageId || 0) !== pinnedBeforeClear) throw new Error("Chat clear replaced the stored pinned status message");
              if (pinnedMessageCalls.length !== pinCallsBeforeClear) throw new Error("Chat clear created a duplicate pinned status message");
              if (!editedMessageCalls.slice(editCallsBeforeClear).some((body) => Number(body.message_id || 0) === pinnedBeforeClear)) throw new Error("Chat clear did not refresh the preserved pinned status callbacks");
              failDeleteMessageId = 0;'''
          if old_clear_test not in test:
              raise SystemExit('chat-clear self-test block marker not found')
          test = test.replace(old_clear_test, new_clear_test, 1)
          test_path.write_text(test, encoding='utf-8-sig')
          PY

      - name: Validate JavaScript syntax and patch markers
        shell: bash
        run: |
          node --check tools/telegram-bridge/v1.0.0/bridge.mjs
          node --check tools/telegram-bridge/v1.0.0/bridge-self-test.mjs
          grep -q 'deleteTelegramMessagesResilient' tools/telegram-bridge/v1.0.0/bridge.mjs
          grep -q 'preservedPinnedMessageId' tools/telegram-bridge/v1.0.0/bridge.mjs

      - name: Commit fix to feature branch
        shell: bash
        run: |
          rm -f .github/workflows/apply-telegram-clear-pin-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/telegram-bridge/v1.0.0/bridge.mjs tools/telegram-bridge/v1.0.0/bridge-self-test.mjs .github/workflows/apply-telegram-clear-pin-fix.yml
          git commit -m "fix: make Telegram chat clear preserve a single status pin"
          git push origin HEAD:fix/telegram-clear-pin
