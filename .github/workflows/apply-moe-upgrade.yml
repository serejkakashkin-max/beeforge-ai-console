name: Apply MoE upgrade
on:
  push:
    branches: [ main ]
    paths:
      - scripts/Apply-MoEUpgrade.ps1
      - scripts/Finish-MoEUpgrade.ps1
      - .github/workflows/apply-moe-upgrade.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply core and UI patch
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Apply-MoEUpgrade.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Primary patch stopped after applying core/UI changes; completion step will finish line-ending-sensitive files."
          }
          pwsh -NoProfile -File scripts/Finish-MoEUpgrade.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate PowerShell
        shell: pwsh
        run: |
          $files = @('scripts/BeeLlamaManager.Core.psm1','ui/BeeLlama-Manager.ps1','tests/MoEProfile.Smoke.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Run MoE smoke test
        shell: pwsh
        run: pwsh -NoProfile -File tests/MoEProfile.Smoke.ps1
      - name: Commit upgrade
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/BeeLlamaManager.Core.psm1 ui/BeeLlama-Manager.ps1 config/templates/profiles.example.json README.md tests/MoEProfile.Smoke.ps1 .github/workflows/powershell-smoke.yml
          git rm scripts/Apply-MoEUpgrade.ps1 scripts/Finish-MoEUpgrade.ps1 .github/workflows/apply-moe-upgrade.yml
          git commit -m "feat: add native MoE CPU offload support"
          git push origin HEAD:main
