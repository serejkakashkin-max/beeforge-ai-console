name: Runtime hardening bootstrap
on:
  push:
    branches: [ fix/runtime-profile-hardening-20260909 ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-hardening-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-profile-hardening-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply hardening patch
        shell: pwsh
        run: python tools/apply-runtime-hardening.py
      - name: Finalize exports, projector family matching and test encoding
        shell: pwsh
        run: |
          $corePath = 'scripts/BeeLlamaManager.Core.psm1'
          $core = [IO.File]::ReadAllText((Resolve-Path $corePath), [Text.UTF8Encoding]::new($false))
          $old = 'Update-BeeOpenCode,Test-BeeRunningProfileMatch,Resolve-BeeBenchmarkRequest'
          $new = 'Update-BeeOpenCode,Test-BeeRunningProfileMatch,Test-BeeVisionProjectorCompatibility,Get-BeeProfileRuntimeFingerprint,Resolve-BeeBenchmarkRequest'
          if (-not $core.Contains($old)) { throw 'Export-ModuleMember anchor not found' }
          $core = $core.Replace($old,$new)
          $familyOld = '$name = if ([string]::IsNullOrWhiteSpace($Path)) { '''' } else { [IO.Path]::GetFileName($Path) }'
          $familyNew = '$name = if ([string]::IsNullOrWhiteSpace($Path)) { '''' } else { [string]$Path }'
          if (-not $core.Contains($familyOld)) { throw 'Vision family anchor not found' }
          $core = $core.Replace($familyOld,$familyNew)
          [IO.File]::WriteAllText((Resolve-Path $corePath),$core,[Text.UTF8Encoding]::new($true))

          $testPath = 'tests/RuntimeProfile.Smoke.ps1'
          $test = [IO.File]::ReadAllText((Resolve-Path $testPath),[Text.UTF8Encoding]::new($false)).TrimStart([char]0xFEFF)
          [IO.File]::WriteAllText((Resolve-Path $testPath),$test,[Text.UTF8Encoding]::new($true))
      - name: Parse changed PowerShell
        shell: pwsh
        run: |
          $files = @('scripts/BeeLlamaManager.Core.psm1','ui/BeeLlama-Manager.ps1') + @(Get-ChildItem tests -Filter '*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Run smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/MoEProfile.Smoke.ps1
          pwsh -NoProfile -File tests/RuntimeProfile.Smoke.ps1
      - name: Commit feature changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden model runtime profiles [runtime-hardening-applied]"
          git push origin HEAD:fix/runtime-profile-hardening-20260909
